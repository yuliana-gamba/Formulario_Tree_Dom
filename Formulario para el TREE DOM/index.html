<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="form-container">
        <h2>Formulario de Registro</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
            </div>

            <div class="form-group">
                <label for="tipo-doc">Tipo de Documento</label>
                <select id="tipo-doc" name="tipo_documento" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                    <option value="TI">Tarjeta de Identidad</option>
                    <option value="PAS">Pasaporte</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dni">DNI / Número de Documento</label>
                <input type="text" id="dni" name="dni" placeholder="Número de documento" required>
            </div>

            <div class="form-group">
                <label for="fecha-nac">Fecha de Nacimiento</label>
                <input type="date" id="fecha-nac" name="fecha_nacimiento" required>
            </div>

            <div class="form-group">
                <label for="telefono">Número de teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="pais">País Domicilio</label>
                <input type="text" id="pais" name="pais" placeholder="País de residencia" required>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad Domicilio</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad de residencia" required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="tratamiento-datos" name="tratamiento_datos" required>
                <label for="tratamiento-datos">Acepto el tratamiento de datos personales</label>
            </div>

            <button type="submit" class="btn-submit">Enviar Datos</button>

        </form>
    </main>

</body>
</html>
